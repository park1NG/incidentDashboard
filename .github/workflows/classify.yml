name: Classify Pending Articles

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: classify-pending
  # 🚨 수정 1: Lock 없는 구조에서 데이터 오염을 막기 위해 강제 종료 금지
  cancel-in-progress: false

jobs:
  classify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run classifier
        env:
          DEBUG_NOTION_QUERY: 1
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          ARTICLES_DB_ID: ${{ secrets.ARTICLES_DB_ID }}
          # 🚨 수정 2: 타임 버짓 및 처리량 튜닝 (15분 크론에 맞춤)
          MAX_RUNTIME_SEC: 840 # 14분 동안 최대한 처리하고 안전 종료
          MAX_PENDING: 50      # 백로그 소진을 위해 한 번에 50개씩 당겨옴
          BATCH_SIZE: 5        # Gemini TPM 한도 초과 방지를 위해 5개씩 묶음
          SLEEP_BETWEEN_BATCHES: 3
          MAX_RETRIES: 6
          BASE_BACKOFF: 2
          MAX_BACKOFF: 60
        run: python classify_pending.py

      - name: Upload Notion Query Debug Log
        uses: actions/upload-artifact@v4
        with:
          name: notion-query-debug
          path: debug_notion_query.jsonl
          if-no-files-found: warn