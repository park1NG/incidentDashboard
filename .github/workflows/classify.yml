name: Classify Pending Articles

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: classify-pending
  cancel-in-progress: true

jobs:
  classify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run classifier
        env:
          DEBUG_NOTION_QUERY: 1
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          ARTICLES_DB_ID: ${{ secrets.ARTICLES_DB_ID }}
          MAX_PENDING: 20
          BATCH_SIZE: 10
          SLEEP_BETWEEN_BATCHES: 3
          MAX_RETRIES: 6
          BASE_BACKOFF: 2
          MAX_BACKOFF: 60
        run: python classify_pending.py

      - name: Upload Notion Query Debug Log
        uses: actions/upload-artifact@v4
        with:
          name: notion-query-debug
          path: debug_notion_query.jsonl
          if-no-files-found: warn
