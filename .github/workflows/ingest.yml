name: Ingest News to Notion

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

concurrency:
  group: ingest-news-to-notion
  cancel-in-progress: true

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run ingestion
        env:
          DEBUG_NOTION_QUERY: 1
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }} 
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          ARTICLES_DB_ID: ${{ secrets.ARTICLES_DB_ID }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: python ingest_news_to_notion.py

      - name: Upload Notion Query Debug Log
        uses: actions/upload-artifact@v4
        with:
          name: notion-query-debug
          path: debug_notion_query.jsonl
          if-no-files-found: warn

      - name: Upload Processed Pages Dump
        uses: actions/upload-artifact@v4
        with:
          name: processed-pages
          path: processed_pages.jsonl
          if-no-files-found: warn
